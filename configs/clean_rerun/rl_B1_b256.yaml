# CLEAN RERUN, RL stage B1, arm A0 (77 languages). GENERATED by scripts/clean_rerun_make_configs.py (agent C1, 2026-10-28): edit the generator, not this file.
# Evidence and costs for every number: reports/clean_rl_stage_plan_2026-10-28.md. Pre-registration: reports/preregistration_${S3_PREFIX}.md (rule sha256 7b86fc11...c0f5, Amendments 1 and 2: the RL bins are capped at 1,024 SOURCE tokens, b2048 is dropped).
# Stage B1: b256 only; RESTART from the previous stage's final/ model with a FRESH reference (= model_name), fresh optimizer, warm-up 10, exactly as phase 2c restarted from the 2b stage-b64 model.
# SPDX-License-Identifier: AGPL-3.0-or-later
model_name: /workspace/clean_rerun/runs/A/final  # KL reference AND policy start; the launcher overrides it with key=value (HANDOFF=final|best)
tokenizer_name: null
prompts_path: /workspace/clean_rerun/prompts/clean_v3  # ONE pool directory (parquet per language) of the clean RL prompt dataset (a private ${HF_ORG} dataset repo; no ${HF_ORG_LEGACY} repo is read); never the repo root; v3 has no domain column (general only)
eval_prompts_path: null  # null: a hash-selected hold-out of `eval_prompts` prompts (the same hold-out in every stage: same pool, same seed)
out_dir: /workspace/clean_rerun/runs/B1

attn_implementation: sdpa
param_dtype: float32
ref_dtype: float32
autocast_dtype: bfloat16

steps: 150  # HARD CAP. The plateau stop / WINDDOWN can only end the stage earlier
prompts_per_step: 48  # fallback; the per-bin table below decides
group_size: 16  # 15 sampled + 1 greedy (D-67 form); 16 is the 2c group size
greedy_stats: sampled  # D-67: baseline / std over the SAMPLED members only
greedy_adv_cap: 3.0  # |advantage of the greedy member| <= 3 before the scale
greedy_adv_scale: 0.3  # D-59/D-67 measured: 1.0 -> grad norm 10-17 (clip crushes everything else), 0.3 -> 0.60
greedy_in_group: true  # owner 2026-10-28: the GREEDY completion is scored in EVERY stage (it is the one that loops at inference). NOTE: the only divergence of the record (2b) had a greedy member, but also lr 3e-6, no std division and no guard
greedy_share_warn: 0.35  # warn when the greedy members carry more than 35 % of the token-weighted |advantage| (uniform: 6 %)
micro_batch_seqs: 320  # the launcher's OOM ladder lowers this (and micro_batch_tokens)
num_updates_per_batch: 1
temperature: 1.0
top_p: 1.0
top_k: 0
allow_truncated_sampling: false
# ---- rollout sampler (D-28): vLLM, weights pushed after every optimizer step
sampler: vllm
vllm_mode: worker
vllm_python: /workspace/venv_vllm/bin/python
vllm_gpu_memory_utilization: 0.2
vllm_kv_cache_gib: null
vllm_max_model_len: 8192  # b1024: ~1,300 prompt + 3,584 new (b2048 is gone: 8,192 is enough)
vllm_max_num_seqs: 512
vllm_max_num_batched_tokens: null
vllm_enforce_eager: false
vllm_sleep: false
vllm_attention_backend: null
vllm_sync_dir: /dev/shm
vllm_startup_timeout: 1800
vllm_request_timeout: 3600
vllm_check_every: 25
vllm_logp_gap_tol: 0.25
max_new_tokens: 1024  # fallback; max_new_tokens_by_bin decides
max_src_tokens: 1024  # SOURCE-side cap (Amendment 2): AfriCOMET-encoder tokens of the English window; b2048 rows are dropped by this
length_bins: true
curriculum_steps:  # one single-bin stage of `steps` steps (no mixed steps)
  b256: 150
prompts_per_step_by_bin:  # 2c values = the MAXIMUM: nothing in the record shows a gain from larger batches (phase 2 used 2x these with group 8: same dev gain per completion)
  b64: 64
  b256: 48
  b512: 42
  b1024: 42
  mixed: 42
max_new_tokens_by_bin:  # Gemma tokens; unchanged from 2c (b2048 and its 7,168 cap are gone)
  b64: 384
  b256: 1280
  b512: 2304
  b1024: 3584
  mixed: 3584
micro_batch_tokens: 49152
language_alpha: 0.0  # draw weight ~ pool_size ** 0 = uniform over languages x language_weights
language_weights: {tir: 2.5, dyu: 2.5, amh: 2.5, kbp: 2.5, fon: 2.5, nus: 2.5, mos: 2.5, kam: 2.5, bam: 2.5, umb: 2.5, kea: 2.5, kmb: 2.5, vmw: 2.5, kab: 2.5, seh: 2.5, yor: 2.5, wol: 2.5, ewe: 2.5, luo: 2.5, tum: 2.5, nyn: 2.5, ach: 2.5, kon: 2.5, pcm: 2.5, shi: 2.5, efi: 2.5, tiv: 2.5, bin: 2.5, ish: 2.5}  # the 25 languages of the DEV-DEFINED weak list x2.5 (reports/weak_language_selection_2026-10-26.md; rule sha256 4472d711...6ab7) PLUS the 4 OWNER-PRIORITY languages efi tiv bin ish x2.5 (owner 2026-10-29, chosen on need, not on test data). Everything else 1.0, including the 27 unmeasured languages (the floor protects them)
# language floor: NOT available here (it needs domain_weights, i.e. a `domain` column, which the v3 pool lacks). Not needed: with 42-64 prompts per step a weight-1 language gets 7-11 prompts per 20 steps (P[< 2] < 0.1 %).
run_controls: true  # <out_dir>/WINDDOWN and <out_dir>/LR_SCALE

learning_rate: 2.0e-06  # 2c / AB2 value
kl_guard_threshold: 0.15  # median KL of the last 5 steps above this halves the lr (floor 1/8, once per 10 steps); 3-7x the healthy KL of b64..mixed (0.02-0.06)
kl_guard_factor: 0.5
kl_guard_min_scale: 0.125
kl_guard_window: 5
kl_guard_cooldown: 10
kl_guard_restore: false  # FALSE at the deliberate fresh-reference restart (coordinator/T2); a crash-restart of this stage then re-arms scale 1.0 - the launcher logs it
kl_guard_recover: false  # off in the stages (T2 recommendation); on in the final run
kl_guard_recover_factor: 1.25
kl_guard_recover_below: 0.5
kl_guard_recover_window: 20
plateau_stop: true  # T2: training-reward slope CI over the last 100 steps contains 0, finished >= 0.99, no guard event in the window -> WINDDOWN 10, then a normal finish
plateau_stop_min_steps: 100  # validator needs >= window; inert when it is >= steps
plateau_stop_window: 100
plateau_stop_block: 20
plateau_stop_min_finished: 0.99
plateau_stop_winddown: 10
plateau_stop_min_lr_scale: 0.5
plateau_stop_bootstrap: 2000
plateau_stop_min_steps_by_bin: {}
plateau_stop_ci_high_max: 0.06  # power guard (T2 recommendation 0.06): the window's slope CI must also exclude a gain above 0.06 reward per 100 steps (2c b256 averaged 0.022 per 100 steps)
# ---- patience-based early stop on EVERY stage (Amendment 4): no new best of the smoothed (10-step) training reward, finished rate or greedy loop rate for `patience` steps after `min_steps` -> WINDDOWN 10 (same mechanism as the plateau stop; whichever fires first). Never inside a window with a guard cut, a changed lr, or a finished rate < 0.99
early_stop: true  # values checked by replay on the old 2b / 2c / final2 series and a Monte-Carlo false-stop table (T2 hand-off 2026-10-29)
early_stop_patience: 80
early_stop_min_steps: 80  # inert when >= steps (the tracker still feeds the extension rule)
early_stop_block: 10  # smoothing block; the 10-step block mean of the 2c training reward has sd 0.02-0.03
early_stop_eps_reward: 0.02  # a new best must beat the old by this much (about one block sd)
early_stop_eps_finished: 0.002
early_stop_eps_loop: 0.005  # greedy loop rate: lower is better
early_stop_min_finished: 0.99
early_stop_min_lr_scale: 0.5
early_stop_winddown: 10
# ---- surgical extension: at the cap (final run: N steps before it, where its planned wind-down would start), if the improvement criterion above fired within the last `extend_recent` steps, the cap is raised by `extend_steps` (about 25 % of the base cap), repeated until +50 % at most. Every decision is logged (extensions.jsonl, summary.json)
extend_if_improving: true
extend_steps: 40
extend_max_frac: 0.5  # hard maximum +50 % of the base cap
extend_recent: 25
planned_winddown_last: 0
# ---- optimizer (Amendment 4): fresh at the start of every stage (every stage has its own out_dir; the final run carries no Adam moments)
optimizer: muon  # muon: Muon on the 2-D decoder matrices + AdamW on embeddings / norms / 1-D, update RMS matched to AdamW (match_rms_adamw), so the learning rate below is the AdamW-equivalent one and was NOT re-tuned
muon_momentum: 0.95
muon_ns_steps: 5
warmup_steps: 10
weight_decay: 0.0
grad_clip: 1.0
advantage_norm: mean_std  # std-normalised, as 2c (2b dropped the division and diverged)
# ---- D-65 language draw weights as a run control; the adaptive updater stays OFF (it never changed a weight in the record, and the dose-response is not identifiable: R13/D-65)
lang_weights_file: true  # <out_dir>/LANG_WEIGHTS.json (operator override, read every step)
lang_stats_log: true  # lang/{n,reward,radj,fail}/<iso> per step: free per-language training statistics
lang_weights_log_every: 50
adaptive_lang_weights: false
hard_fail_mask: "off"
std_eps: 0.0001
kl_coef: 0.05
kl_estimator: k3c  # k3 with the log-ratio clamped at 5 (the 2c outlier fix)
clip_eps: null
loss_agg: token
loss_chunk_tokens: 2048
gradient_checkpointing: false

reward:
  preset: repo  # repo: [-2, +2.25]
  mode: calibrated
  calibration_path: /workspace/clean_rerun/assets/calibration/shaping_clean_v1.json  # REFIT on T2 only (H_cal, SSA-MTE train, IbomMT train); produced by the calibration agents; replaces shaping_flores_dev_v8.json
  fail_floor: 0.0  # D-32
  neg_scale: 2.0
  penalty: null  # null = floor of the range
  prefix_policy: require
  lid_enabled: true  # D-37 GlotLID guard (thresholds re-measured on H_cal inside shaping_clean_v1.json `lid`)
  lid_min_chars: 15
  lid_model_path: /workspace/sft_build/hf/hub/models--cis-lmu--glotlid/snapshots/85cd6716494360367b75f642b5bc78667605d0b4/model_v3.bin
  lid_disable: []
  consensus: true  # D-38 group consensus, ALL stages (owner 2026-10-28: every reward component stays, including consensus)
  consensus_min_valid: 3
  consensus_skip_value: 0.0
  content_mode_default: qe
  content_modes: {}
  consensus_beta: {}
