select_min_finished_rate: 0.95
benchmark_aux:  # monitor-only
  - {name: weak_dev, path: /workspace/clean_rerun/assets/dev/bench_weak_hsel.jsonl, per_language: 60, max_new_tokens: 256, batch_size: 64}
save_every: 20
log_every: 1
