  anchors_stuff_gate: 0.9
  nllb_signal: true  # D-66 NLLB-3.3B pseudo-reference chrF++ signal: ON in A/B1/mixed/final (owner 2026-10-29; off in B2 / B3 = long bins), reward only, CC-BY-NC output, disclose in the paper
  nllb_pseudoref_dir: /workspace/clean_rerun/assets/pseudorefs_reward_only_nc_v1  # pseudo-references of the clean prompt pools (prompts that match a protected set are dropped); NC licence
  nllb_calibration_path: /workspace/clean_rerun/assets/calibration/nllb_reward_calibration_clean.json  # language rule evaluated on H_sel, NOT devtest
  nllb_modes: [consensus, blend]
  nllb_languages: [kea, kbp, nus, bam, kab]  # PROVISIONAL placeholder list (configs/clean_rerun/nllb_languages.json): replace it with the output of the H_sel language rule after A0 exists; weights from the calibration file
  nllb_weight_default: 0.35
  nllb_weight_max: 0.5
  nllb_weights: {kon: 0.0}  # per-language overrides (nllb_languages.json `weights`); everything else from the calibration file / nllb_weight_default
  nllb_min_teacher_delta: 2.0
  nllb_min_auc: 0.8
  nllb_forced: false
  longdoc_v2: true  # D-60 long-document limits (only sources with >= longdoc_min_src_words words)
  longdoc_calibration_path: /workspace/clean_rerun/assets/calibration/longdoc_clean.json  # REFIT without AfriLongDoc / SmolDoc; the old longdoc_v2.json was fitted on forbidden NLLB references
  longdoc_min_src_words: 150
  longdoc_repetition: true
  longdoc_align: anchored
  longdoc_lexicon: false
