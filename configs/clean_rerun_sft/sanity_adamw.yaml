# SPDX-License-Identifier: AGPL-3.0-or-later
# Clean rerun, arm optimizer sanity (AdamW): 300 steps of A0's schedule with AdamW (decision AdamW vs Muon by validation loss, Amendment 4 item 3)
# Pre-registration: reports/preregistration_clean_rerun_2026-10-28.md + AMENDMENT_1..4 (reports/data/prereg_clean_2026-10-28/).
#   python -m gemma_mt.train_sft --config configs/clean_rerun_sft/sanity_adamw.yaml [key=value ...]
# Run from the folder that holds packed/, sched/ (built by data_pipeline/sft_clean/chain: pack.py prepare, sampler.py plan/arms/select/subset/head); every path below is relative to it.
# Schedule: python sampler.py head --schedule sched/A0 --steps 300 --name A0_head300 --out sched/A0_head300   (the first 300 steps of A0; the LR schedule is over these 300 steps)
# Pair: sanity_adamw.yaml vs sanity_muon.yaml, identical except the optimizer. Compare val_loss_macro at steps 100, 200, 300.
model_name: google/gemma-3-270m-it
tokenizer_name: null
data_dir: packed
out_dir: runs/sanity_adamw

# ---- the packs of every step come from a schedule file (sha256, length and per-language draws are logged and saved to runs/sanity_adamw/schedule_manifest.json)
schedule_file: sched/A0_head300/schedule.npy
schedule_require_sidecar: true       # the sidecar (schedule.json, written by sampler.py) pins the schedule and the packed dataset it was drawn on
max_steps: 0                         # the file length is the run length (must be 0 or equal to it)
epochs: 1.0                          # ignored with a schedule file
language_alpha: null
unimax_budget_tokens: 0

attn_implementation: sdpa
mask_mode: auto
loss_impl: chunked
param_dtype: float32                 # fp32 master weights ...
autocast_dtype: bfloat16             # ... with bf16 autocast
gradient_checkpointing: true         # 4,096-token packs
loss_chunk_tokens: 512

# batch = micro_batch_size x grad_accum_steps x 1 GPU x 4,096 = 2 x 16 x 4,096 = 131,072 tokens (32 packs) per optimizer step: the width of the schedule files
micro_batch_size: 2
grad_accum_steps: 16

# ---- optimizer (Amendment 4 item 3): AdamW, lr 5e-5 (the comparison arm of the 300-step sanity pair)
optimizer: adamw
muon_momentum: 0.95
muon_ns_steps: 5
learning_rate: 5.0e-5
min_lr_ratio: 0.1                    # cosine to 10% of the peak
warmup_steps: 0
warmup_ratio: 0.03                   # 3% of the schedule length, linear
weight_decay: 0.01
beta1: 0.9
beta2: 0.95
eps: 1.0e-8
grad_clip: 1.0

# ---- evaluation / stopping: early stopping is INERT (patience 0: the validation loss is logged and the best is tracked, but nothing ends the run)
eval_every: 100
eval_max_packs: 0
val_metric: macro
min_val_tokens_macro: 2000
early_stopping_patience: 0
early_stopping_min_delta: 0.0
early_stop_action: propose           # (not used with patience 0) never ends a run by itself
min_epochs: 1.0
quick_eval_every: 0
save_every: 20                         # owner 2026-10-31: checkpoint (weights + optimizer + RNG) every 20 steps in every phase
log_every: 10
keep_prev_checkpoint: true
keep_single_checkpoint: true         # local disk: last/ (resumable) and last_prev/ only
resume: true
seed: 1234
wandb_project: null
run_name: sanity_adamw

# ---- Hub: PRIVATE, ${HF_ORG} organisation (needs HF_WRITE_TOKEN in the environment; never write a token here). The final weights are always pushed (tag step-<N>).
hub_repo_id: ${HF_ORG}/gemma3-270m-clean-sanity-adamw
hub_private: true                    # explicit: the trainer's default is also private, this line makes the intent unmistakable
hub_push_every: 100000
hub_push_best_only: false
