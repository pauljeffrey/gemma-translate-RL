# Clean rerun, arm A2-up6: 270M + 6 inserted sliding-window layers (24 layers, 301,539,968 parameters, exact identity at init), same subset and hyper-parameters as A2-base
# Pre-registration: reports/preregistration_${S3_PREFIX}.md + AMENDMENT_1..4 (reports/data/prereg_clean_2026-10-28/).
#   python -m gemma_mt.train_sft --config configs/clean_rerun_sft/a2_up6.yaml [key=value ...]
# Run from the folder that holds packed/, sched/ (built by data_pipeline/sft_clean/chain: pack.py prepare, sampler.py plan/arms/select/subset/head); every path below is relative to it.
# Start checkpoint: python scripts/upcycle_layers.py --model google/gemma-3-270m-it --out ckpt/gemma3-270m-up6 --n-new 6 --post-norm-gain 0.01   (exact identity of the base at init: scripts/upcycle_check.py; gain 0.01 = decision of 2026-10-30, removes the switch-on loss spike)
# The inserted layers are LOCAL (sliding-window) layers; all 301,539,968 parameters train from step 1; the new layers' two post-norm gains are 0.01 (recorded in upcycle.json). Tokenizer files are copied into the checkpoint.
# The A2 subset is built ONCE and shared by all four A2 arms (same schedule.npy, same sha256 in the sidecar):
#   python sampler.py subset --schedule sched/A0 --frac 0.25 --floor-draws 100 --stratify language --method systematic --seed 1234 --name A2 --out sched/A2
#   = A0's language mix at 25% (evenly spaced draws of each language's A0 sequence, in A0's order) with a floor of min(all draws, 100) per language.
# The four arms differ ONLY in the model; hyper-parameters, schedule, seed and batch (131,072 tokens/step) are identical. Evaluation: vLLM, FLORES+ H_sel (Amendment 3).
model_name: ckpt/gemma3-270m-up6
tokenizer_name: google/gemma-3-270m-it
data_dir: packed
out_dir: runs/a2_up6

# ---- the packs of every step come from a schedule file (sha256, length and per-language draws are logged and saved to runs/a2_up6/schedule_manifest.json)
schedule_file: sched/A2/schedule.npy
schedule_require_sidecar: true       # the sidecar (schedule.json, written by sampler.py) pins the schedule and the packed dataset it was drawn on
max_steps: 0                         # the file length is the run length (must be 0 or equal to it)
epochs: 1.0                          # ignored with a schedule file
language_alpha: null
unimax_budget_tokens: 0

attn_implementation: varlen            # 2026-10-30 benchmark on the A40: 3.2x faster than sdpa+explicit mask+chunked loss, same step-1 loss (6.5148 vs 6.5150)
mask_mode: flash
loss_impl: fused
param_dtype: float32                 # fp32 master weights ...
autocast_dtype: bfloat16             # ... with bf16 autocast
gradient_checkpointing: true         # 4,096-token packs
loss_chunk_tokens: 512

# batch = micro_batch_size x grad_accum_steps x 1 GPU x 4,096 = 2 x 16 x 4,096 = 131,072 tokens (32 packs) per optimizer step: the width of the schedule files
micro_batch_size: 2
grad_accum_steps: 16

# ---- optimizer (Amendment 4 item 3): Muon on the 2-D decoder matrices, AdamW on the embedding / norms; one learning rate (5e-5), update RMS matched to AdamW (adjust_lr_fn match_rms_adamw); settings of configs/sft_unimax.yaml except lr 4e-5 -> 5e-5 (owner, Amendment 4)
optimizer: muon
muon_momentum: 0.95
muon_ns_steps: 5
learning_rate: 5.0e-5
min_lr_ratio: 0.1                    # cosine to 10% of the peak
warmup_steps: 0
warmup_ratio: 0.03                   # 3% of the schedule length, linear
weight_decay: 0.01
beta1: 0.9
beta2: 0.95
eps: 1.0e-8
grad_clip: 1.0

# ---- evaluation / stopping: early stopping is INERT (patience 0: the validation loss is logged and the best is tracked, but nothing ends the run)
eval_every: 250
eval_max_packs: 0
val_metric: macro
min_val_tokens_macro: 2000
early_stopping_patience: 0
early_stopping_min_delta: 0.0
early_stop_action: propose           # (not used with patience 0) never ends a run by itself
min_epochs: 1.0
quick_eval_every: 0
save_every: 20                         # owner 2026-10-31: checkpoint (weights + optimizer + RNG) every 20 steps in every phase
log_every: 10
keep_prev_checkpoint: true
keep_single_checkpoint: true         # local disk: last/ (resumable) and last_prev/ only
resume: true
seed: 1234
wandb_project: null
run_name: a2_up6

# ---- Hub: PRIVATE, ${HF_ORG} organisation (needs HF_WRITE_TOKEN in the environment; never write a token here). The final weights are always pushed (tag step-<N>).
hub_repo_id: ${HF_ORG}/gemma3-270m-clean-a2-up6
hub_private: true                    # explicit: the trainer's default is also private, this line makes the intent unmistakable
hub_push_every: 1000
hub_push_best_only: false
