# 385M GROWN MODEL (owner 2026-11-01): GENERATED by scripts/clean_rerun_385m_make_configs.py from the clean-rerun generator (same recipe, caps and reward as configs/clean_rerun; see that script for the overrides).
# Policy and KL reference start: the SFT final of the growth-1 run (runs/g1b_s6/last, exported to HF format) = 39 layers (36 sliding + 3 global, sliding_window_pattern 13), 385,144,448 parameters.
# SINGLE-TOKEN TAG MODE: run with GEMMA_MT_TAG_MODE=single_token (scripts/launch_clean_rerun_385m.sh exports it); there is no yaml key for it.
# CLEAN RERUN, OPTIONAL RL stage F2 (final_long), arm A0 (77 languages). GENERATED by scripts/clean_rerun_make_configs.py (agent C1, 2026-10-28): edit the generator, not this file.
# Evidence and costs for every number: reports/clean_rl_stage_plan_2026-10-28.md. Pre-registration: reports/preregistration_clean_rerun_2026-10-28.md (rule sha256 7b86fc11...c0f5, Amendments 1 and 2: the 270M plan capped the RL bins at 1,024 SOURCE tokens; THIS 385M plan caps them at 256 (b256 CAP, owner 2026-11-02)).
# F2 (owner 2026-11-02, OPTIONAL, science only): b1024 60 % + b2048 40 % of the SCIENCE prompts, 70 steps, from the FINAL run's model (policy start AND KL reference, fresh optimizer). Kept only if it passes the
# paper-level gate of scripts/clean_rerun_tools.py f2-decide (reports/rl_stage_plan_385m_b256_2026-11-02.md section 6); run only when f2-precheck says RUN. NLLB signal OFF (long windows: D-66, as B2 / B3).
# SPDX-License-Identifier: AGPL-3.0-or-later
model_name: /workspace/clean_rerun/runs_385m/final/final  # the FINAL run's end model (F) = policy start AND KL reference; the launcher sets it to the hand-off of the final run (HANDOFF=final|best)
tokenizer_name: /workspace/clean_rerun/assets/tokenizer_gemma3_tags  # RENAMED tokenizer (<yor> ... instead of <unusedK>, same ids); it must also be the tokenizer of the exported model dirs
prompts_path: /workspace/clean_rerun/prompts/clean_sci_v2_long  # clean_sci_v2 (b64..b1024, decontaminated) + zz_b2048/ (the b2048 science rows of the ORIGINAL sci_v2 AFTER the decon.py scan: the clean pool dropped b2048 unscanned); scripts/clean_rerun_385m_prepare_f2_pool.sh
eval_prompts_path: null  # null: a hash-selected hold-out of `eval_prompts` prompts (the same hold-out in every stage: same pool, same seed)
out_dir: /workspace/clean_rerun/runs_385m/F2

attn_implementation: sdpa
param_dtype: float32
ref_dtype: float32
autocast_dtype: bfloat16

steps: 70  # HARD CAP. F2 is short: it only has to teach the model to finish and not loop on whole papers
prompts_per_step: 28  # fallback; the per-bin table below decides
group_size: 16  # 15 sampled + 1 greedy (D-67 form); 16 is the 2c group size
greedy_stats: sampled  # D-67: baseline / std over the SAMPLED members only
greedy_adv_cap: 3.0  # |advantage of the greedy member| <= 3 before the scale
greedy_adv_scale: 0.3  # D-59/D-67 measured: 1.0 -> grad norm 10-17 (clip crushes everything else), 0.3 -> 0.60
greedy_in_group: true  # owner 2026-10-28: the GREEDY completion is scored in EVERY stage (it is the one that loops at inference). NOTE: the only divergence of the record (2b) had a greedy member, but also lr 3e-6, no std division and no guard
greedy_share_warn: 0.35  # warn when the greedy members carry more than 35 % of the token-weighted |advantage| (uniform: 6 %)
# dynamic sampling (DAPO-style, owner 2026-11-03; rl/dynamic_sampling.py): groups whose rewards have no spread (std < dynamic_sampling_min_std) give zero advantage: draw ceil(prompts x oversample) prompts, drop the flat
# groups, refill the deficit with replacement prompts of the same language / domain / bin (at most max_refills extra rounds) and update on the first `prompts` informative groups. reward / finished rate / greedy_*
# / per-language statistics are logged on ALL generated groups; ds/... counters and <out_dir>/dynamic_sampling_by_language.json show what the filter did.
dynamic_sampling: false  # F2: long documents (b1024 / b2048) cost far more per prompt; flat groups are rare there and an over-sampled draw would not pay (the translation stages and the final run use it)
dynamic_sampling_oversample: 1.1
dynamic_sampling_max_refills: 2
dynamic_sampling_min_std: 0.01
# advantage std floor (owner 2026-11-03): advantage = (r - mean) / max(std, adv_std_floor); only groups with std below the floor (near-flat: jitter in the 3rd decimal of a QE score) are damped, |A| ~ std / floor.
# 0.02 reward units = ~0.005 AfriCOMET-QE units (the shaping slope is ~4 reward units per QE unit) = noise level. The preflight did not log per-group stds: <out_dir>/group_stats.jsonl (log_group_stats) now does,
# scripts/group_std_percentiles.py reads it; re-set the floor at ~the 10th percentile of the group stds at a checkpoint boundary if it differs.
adv_std_floor: 0.02
log_group_stats: true  # per-prompt group statistics (prompt, language, bin, domain, std, mean, hard failures, guide) -> <out_dir>/group_stats.jsonl, group_std/p05..p75 in the step record (input of a later prompt replay by learnability)
# beam-guided group member (owner 2026-11-03): for guide_fraction of the prompts the beam-guide_beams translation of the CURRENT policy (HF generate on the training model) replaces the last sampled member of the group
# (group size unchanged: samples ..., guide, greedy). Scored like any member (guards, penalties, reference term), part of the group mean / std and of the KL term like the greedy member; a hard-failed guide is dropped
# from its group; guide_adv_share_cap limits the guides' share of the token-weighted |advantage| of the step. Ratio fixed at 1 (one update per batch), no importance weight. Logged: guide/... and guide_by_language.json.
guide_fraction: 0.0  # F2: a beam search over a 7k-token document costs minutes; no guide in the long-document stage
guide_beams: 4
guide_adv_share_cap: 0.25
# MBR guide for the weak languages (owner 2026-11-03): the weak list (the x2.5 language weights) + orm lug; MBR over the group's members + the beam output + guide_mbr_extra_samples extra samples
# (T 0.7, top-p 0.95, drawn for those prompts only), utility chrF++ (the consensus utility); a winner that is a group member keeps the beam output as the guide; the extra samples are skipped for a step
# when the running guide overhead exceeds guide_mbr_max_overhead_frac. All other languages use the beam guide.
guide_mode_by_language: {tir: mbr, dyu: mbr, amh: mbr, kbp: mbr, fon: mbr, nus: mbr, mos: mbr, kam: mbr, bam: mbr, umb: mbr, kea: mbr, kmb: mbr, vmw: mbr, kab: mbr, seh: mbr, yor: mbr, wol: mbr, ewe: mbr, luo: mbr, tum: mbr, nyn: mbr, ach: mbr, kon: mbr, pcm: mbr, shi: mbr, efi: mbr, tiv: mbr, bin: mbr, ish: mbr, orm: mbr, lug: mbr}
guide_mbr_extra_samples: 16
guide_mbr_temperature: 0.7
guide_mbr_top_p: 0.95
guide_mbr_max_overhead_frac: 0.20
# early stop on the DEV metrics (owner 2026-11-03): the dev macro chrF++ (select_by benchmark_chrf) and weak_dev have both not improved by >= early_stop_dev_eps for early_stop_dev_k consecutive DEV evaluations
# (benchmark_eval_every 25: 3 x 25 = 75 steps) while the stage has >= 75 steps and the finished rates are >= 0.98 -> WINDDOWN 10, normal finish, stop_reason dev_plateau. Stage A's flat dev (40.14 @100 .. 40.50 @400)
# never stopped the training-reward trackers. A KL-guard event blocks it only inside the stale window; there is no learning-rate condition.
early_stop_dev: false  # F2: 70 steps, early_stop_dev_min_steps is 75 anyway
early_stop_dev_k: 3
early_stop_dev_eps: 0.15
early_stop_dev_min_steps: 75
early_stop_dev_min_finished: 0.98
early_stop_dev_winddown: 10
early_stop_dev_aux: weak_dev
save_dev_predictions: false  # F2: off
# held-out AfriCOMET monitor, reward-hacking alarm, combined dev stop, per-language dev history (patch 3, owner 2026-11-03). masakhane/africomet-stl-1.1 is REFERENCE-BASED and not one of the QE checkpoints the policy trains on
# (africomet-qe-stl-1.1, ssa-comet-mtl); it scores the dev translations against the human dev references for the AfriCOMET languages in a separate comet worker that is released after each dev evaluation.
heldout_comet: false  # F2: off
heldout_comet_model: masakhane/africomet-stl-1.1
heldout_comet_batch_size: 64
heldout_comet_keep_loaded: false
heldout_comet_bootstrap: 200
hacking_alarm: false
hacking_alarm_k: 3
hacking_alarm_eps_chrf: 0.3
hacking_alarm_eps_comet: 0.005
hacking_alarm_winddown: 10
early_stop_dev_require_comet: false
early_stop_dev_eps_comet: 0.004
lang_stall_log: false
lang_stall_k: 3
lang_stall_eps_chrf: 0.5
lang_stall_eps_comet: 0.01
micro_batch_seqs: 320  # the launcher's OOM ladder lowers this (and micro_batch_tokens)
num_updates_per_batch: 1
temperature: 1.0
top_p: 1.0
top_k: 0
allow_truncated_sampling: false
# ---- rollout sampler (D-28): vLLM, weights pushed after every optimizer step
sampler: vllm
vllm_mode: worker
vllm_python: /workspace/venv_vllm/bin/python
vllm_gpu_memory_utilization: 0.3  # 0.30 (final: 0.20): sequences of up to ~9.5k tokens need a larger KV pool (reports/rl_gpu_ram_385m_2026-11-01.md)
vllm_kv_cache_gib: null
vllm_max_model_len: 10240  # b2048 prompt (<= ~2,300) + 7,168 new tokens; the old final run's value
vllm_max_num_seqs: 512
vllm_max_num_batched_tokens: null
vllm_enforce_eager: false
vllm_sleep: false
vllm_attention_backend: null
vllm_sync_dir: /dev/shm
vllm_startup_timeout: 1800
vllm_request_timeout: 3600
vllm_check_every: 25
vllm_logp_gap_tol: 0.25
max_new_tokens: 1024  # fallback; max_new_tokens_by_bin decides
max_src_tokens: 2048  # F2: SOURCE-side cap = the upper edge of b2048; the science weights below leave only b1024 and b2048 in use
length_bins: true
curriculum_steps:  # a staged bin with 0 steps keeps the schedule in curriculum mode, i.e. MIXED from step 0 (domain -> bin -> language -> prompt)
  b64: 0
prompts_per_step_by_bin:  # F2: 2c maxima for the single bins; mixed 28 x group 16 = 448 completions per step
  b1024: 42
  b2048: 21
  mixed: 28
max_new_tokens_by_bin:  # Gemma tokens; the old generator's table + D-45 (b2048 7,168 = 3.5 x 2,048); ONE cap per mixed step, so b1024 prompts of F2 also get 7,168
  b64: 384
  b256: 1280
  b512: 2304
  b1024: 3584
  b2048: 7168
  mixed: 7168
micro_batch_tokens: 49152
language_alpha: 0.0  # draw weight ~ pool_size ** 0 = uniform over languages x language_weights
language_weights: {tir: 2.5, dyu: 2.5, amh: 2.5, kbp: 2.5, fon: 2.5, nus: 2.5, mos: 2.5, kam: 2.5, bam: 2.5, umb: 2.5, kea: 2.5, kmb: 2.5, vmw: 2.5, kab: 2.5, seh: 2.5, yor: 2.5, wol: 2.5, ewe: 2.5, luo: 2.5, tum: 2.5, nyn: 2.5, ach: 2.5, kon: 2.5, pcm: 2.5, shi: 2.5, efi: 2.5, tiv: 2.5, bin: 2.5, ish: 2.5}  # the 25 languages of the DEV-DEFINED weak list x2.5 (reports/weak_language_selection_2026-10-26.md; rule sha256 4472d711...6ab7) PLUS the 4 OWNER-PRIORITY languages efi tiv bin ish x2.5 (owner 2026-10-29, chosen on need, not on test data). Everything else 1.0, including the 27 unmeasured languages (the floor protects them)
language_floor_steps: 20  # D-59 floor: every language >= 2 prompts in every aligned block of 20 steps (needs the domain mixture, i.e. the sci_v2 pool)
language_floor_prompts: 2
run_controls: true  # <out_dir>/WINDDOWN and <out_dir>/LR_SCALE
domain_weights: {science: 1.0}  # F2: science prompts only (the pool also carries general rows; they are never drawn)
domain_bin_weights:  # F2: b1024 : b2048 = 60 : 40 of the science mass (the AfriScience-MT dev papers are 16 b1024 : 9 b2048)
  science: {b1024: 0.6, b2048: 0.4}

learning_rate: 1.0e-06  # D-59 lower end of the owner's range; fresh Adam state here (the old final run carried the 2c moments, which made the same lr ~3x faster)
kl_guard_threshold: 0.25  # median KL of the last 5 steps above this halves the lr (floor 1/8, once per 10 steps); 0.25 in the final run: reference = start model, kl_coef 0.1 puts the healthy KL at 0.10-0.14 (old final: 250 of 401 steps ran at 25-75 % lr with 0.15)
kl_guard_factor: 0.5
kl_guard_min_scale: 0.125
kl_guard_window: 5
kl_guard_cooldown: 10
kl_guard_restore: false  # FALSE at the deliberate fresh-reference restart (coordinator/T2); a crash-restart of this stage then re-arms scale 1.0 - the launcher logs it
kl_guard_recover: true  # T2: after a cut, when the median KL of the last 20 steps is below 0.5 x threshold the scale is multiplied by 1.25 (never above 1.0); on in the FINAL run only
kl_guard_recover_factor: 1.25
kl_guard_recover_below: 0.5
kl_guard_recover_window: 20
plateau_stop: false  # off: the 70-step cap is shorter than the 100-step window
plateau_stop_min_steps: 150
plateau_stop_window: 100
plateau_stop_block: 20
plateau_stop_min_finished: 0.99
plateau_stop_winddown: 10
plateau_stop_min_lr_scale: 0.5
plateau_stop_bootstrap: 2000
plateau_stop_min_steps_by_bin: {}
plateau_stop_ci_high_max: 0.06  # power guard (T2 recommendation 0.06): the window's slope CI must also exclude a gain above 0.06 reward per 100 steps (2c b256 averaged 0.022 per 100 steps)
# ---- patience-based early stop on EVERY stage (Amendment 4): no new best of the smoothed (10-step) training reward, finished rate or greedy loop rate for `patience` steps after `min_steps` -> WINDDOWN 10 (same mechanism as the plateau stop; whichever fires first). Never inside a window with a guard cut, a changed lr, or a finished rate < 0.99
early_stop: true  # values checked by replay on the old 2b / 2c / final2 series and a Monte-Carlo false-stop table (T2 hand-off 2026-10-29)
early_stop_patience: 40  # as B3 / mixed
early_stop_min_steps: 30  # as B3 / mixed
early_stop_block: 10  # smoothing block; the 10-step block mean of the 2c training reward has sd 0.02-0.03
early_stop_eps_reward: 0.02  # a new best must beat the old by this much (about one block sd)
early_stop_eps_finished: 0.002
early_stop_eps_loop: 0.005  # greedy loop rate: lower is better
early_stop_min_finished: 0.99
early_stop_min_lr_scale: 0.5
early_stop_winddown: 10
# ---- surgical extension: at the cap (final run: N steps before it, where its planned wind-down would start), if the improvement criterion above fired within the last `extend_recent` steps, the cap is raised by `extend_steps` (about 25 % of the base cap), repeated until +50 % at most. Every decision is logged (extensions.jsonl, summary.json)
extend_if_improving: true
extend_steps: 20  # extend_steps > planned_winddown_last is required
extend_max_frac: 0.5  # hard maximum +50 % of the base cap
extend_recent: 25
planned_winddown_last: 15  # F2: the trainer starts the planned lr decay itself 15 steps before the (possibly extended) cap
# ---- optimizer (Amendment 4): fresh at the start of every stage (every stage has its own out_dir; the final run carries no Adam moments)
optimizer: muon  # muon: Muon on the 2-D decoder matrices + AdamW on embeddings / norms / 1-D, update RMS matched to AdamW (match_rms_adamw), so the learning rate below is the AdamW-equivalent one and was NOT re-tuned
muon_momentum: 0.95
muon_ns_steps: 5
warmup_steps: 10  # F2: 70-step stage, warm-up as the B stages (final: 20)
weight_decay: 0.0
grad_clip: 1.0
advantage_norm: mean_std  # std-normalised, as 2c (2b dropped the division and diverged)
# ---- D-65 language draw weights as a run control; the adaptive updater stays OFF (it never changed a weight in the record, and the dose-response is not identifiable: R13/D-65)
lang_weights_file: true  # <out_dir>/LANG_WEIGHTS.json (operator override, read every step)
lang_stats_log: true  # lang/{n,reward,radj,fail}/<iso> per step: free per-language training statistics
lang_weights_log_every: 50
adaptive_lang_weights: false
hard_fail_mask: "off"
std_eps: 0.0001
kl_coef: 0.1  # final run: reference = start model, 0.1 as executed in the old final run (its yaml said 0.05, the CLI override 0.1)
kl_estimator: k3c  # k3 with the log-ratio clamped at 5 (the 2c outlier fix)
clip_eps: null
loss_agg: token
loss_chunk_tokens: 2048
gradient_checkpointing: true  # F2: a 9.5k-token sequence x 39 layers does not fit an 80 GB card without it next to vLLM 0.30 (~15 GB trainer with it, reports/rl_gpu_ram_385m_2026-11-01.md); compute +25-35 % on the update part only

reward:
  preset: repo  # repo: [-2, +2.25]
  mode: calibrated
  calibration_path: /workspace/clean_rerun/assets/calibration/shaping_clean_v2.json  # REFIT on T2 only (H_cal, SSA-MTE train, IbomMT train); produced by the calibration agents; replaces shaping_flores_dev_v8.json
  fail_floor: 0.0  # D-32
  neg_scale: 2.0
  penalty: null  # null = floor of the range
  prefix_policy: require
  lid_enabled: true  # D-37 GlotLID guard (thresholds re-measured on H_cal inside shaping_clean_v2.json `lid`)
  lid_min_chars: 15
  lid_model_path: /workspace/sft_build/hf/hub/models--cis-lmu--glotlid/snapshots/85cd6716494360367b75f642b5bc78667605d0b4/model_v3.bin
  lid_disable: []
  consensus: true  # D-38 group consensus, ALL stages (owner 2026-10-28: every reward component stays, including consensus)
  consensus_min_valid: 3
  consensus_skip_value: 0.0
  content_mode_default: qe
  content_modes: {}
  consensus_beta: {}
  consensus_beta_default: 0.5
  selfrep_guard: consensus
  min_len_ratio_uncalibrated: 0.4
  max_comet_tokens: 510
  nfc: true
  chunking: sentences  # Gale-Church sentence alignment, as in 2c
  omission_detector: true
  omission_cost: null  # language's own value from the calibration file
  omission_short_frac: 0.7
  omission_short_min: 0.15
  diacritic_penalty: 1.0
  chunk_agg: source_length
  extra_output_penalty: true
  length_penalty: 1.0
  word_ratio_penalty: 0.5  # 2026-10-21; calibration `word_ratio`
  word_ratio_slack: 0.15
  science_anchor_penalty: 0.5  # D-52, science prompts only; 0 in the general stages (they carry no science prompts)
  science_anchor_path: /workspace/clean_rerun/assets/calibration/science_anchor_clean.json  # REFIT on the clean AfriScience-MT train set (data S3); the old science_anchor_v1.json was fitted on test splits
  science_anchor_domains: [science]
  anchors_enabled: true  # D-56 constraint penalties
  anchors_calibration_path: /workspace/clean_rerun/assets/calibration/anchors_clean.json  # REFIT on T2 (anchors v1-v3 design, lexicon blocks); replaces anchors_v2.json
  anchors_modes: [consensus, blend]
  anchors_off_languages: []
  anchors_entity_weight: 0.5
  anchors_repeat_weight: 1.0
  anchors_boiler_weight: 1.0
  anchors_lexicon_weight: 1.0
  anchors_lexicon_per_language: true
  anchors_lexicon_weight_cap: 0.25
  anchors_lexicon_guard: true
  anchors_lexicon_dir: /workspace/clean_rerun/assets/lexicon  # rebuilt from clean SFT pairs, validated on H_cal
  anchors_v2_enabled: true  # D-61
  anchors_v2_modes: [qe, blend, consensus]
  anchors_v2_off_languages: []
  anchors_entity_mode: soft
  anchors_copy_scale: 2.0
  anchors_copy_mode: cap
  anchors_func_weight: 0.3
  anchors_pad_weight: 1.0
  anchors_stuff_gate: 0.9
  nllb_signal: false  # F2 = long windows: NLLB pseudo-references exist per sentence of the clean pools only (D-66 is off in the long-bin stages B2 / B3 for the same reason)
  nllb_pseudoref_dir: /workspace/clean_rerun/assets/pseudorefs_reward_only_nc_v1  # pseudo-references of the clean prompt pools (prompts that match a protected set are dropped); NC licence
  nllb_calibration_path: /workspace/clean_rerun/assets/calibration/nllb_reward_calibration_clean.json  # language rule evaluated on H_sel, NOT devtest
  nllb_modes: [consensus, blend]
  nllb_languages: []  # off in this stage
  nllb_weight_default: 0.25
  nllb_weight_max: 0.35
  nllb_weights: {kon: 0.0}  # per-language overrides (nllb_languages.json `weights`); everything else from the calibration file / nllb_weight_default
  nllb_min_teacher_delta: 2.0
  nllb_min_auc: 0.8
  nllb_forced: false
  longdoc_v2: true  # D-60 long-document limits (only sources with >= longdoc_min_src_words words)
  longdoc_compare_v1: true  # diagnostic only: logs the longdoc path against the v1 guards / plain mean for the preflight
  reference_weight: 0.35  # owner 2026-11-03: r = (1 - w) r_existing + w consensus_value(chrF++ vs the human reference), on prompts that carry one (domain ref); failures / guards / penalties untouched
  longdoc_calibration_path: /workspace/clean_rerun/assets/calibration/longdoc_clean.json  # REFIT without AfriLongDoc / SmolDoc; the old longdoc_v2.json was fitted on forbidden NLLB references
  longdoc_min_src_words: 1  # 385M plan (owner 2026-11-02): longdoc_v2 on EVERY source, also b64 / b256 (was 150 words); see scripts/clean_rerun_385m_make_configs.py
  longdoc_repetition: true
  longdoc_align: anchored
  longdoc_lexicon: false
  longdoc_agg: cvar_excess
  longdoc_agg_alpha: 1.0
  longdoc_agg_q: 0.25
  longdoc_coverage_kappa: 0.5
  longdoc_pool_severity: 0.5
  anchors_bigram_path: /workspace/clean_rerun/assets/calibration/anchors_clean_bigrams.npz
  anchors_lid_prob_weight: 0.0
  anchors_buffer_capacity: 600
  anchors_buffer_per_prompt: 4
  anchors_buffer_min_outputs: 150
  anchors_buffer_min_prompts: 30
  qe_ensemble: true  # D-55 AfriCOMET-QE + SSA-COMET-MTL
  qe_ensemble_delta: 1.0
  qe_ensemble_reliability: ensemble
  lexical_penalty: 1.0
  reliability_from: same_source
  eos_discipline: true  # D-26
  eos_truncated_penalty: null
  eos_post_end_penalty: null
  eos_dangling_penalty: null

  # ---- NEW, OFF (2026-11-01): switch on one at a time AFTER the preflight has been examined (reports/rl_reward_explained_2026-10-19_v3.md sections 32-34)
  # confidence: true          # D-47 gate / trust / cap (confidence_gate, confidence_trust, confidence_cap default true once the master switch is on; confidence_relative true)
  # fluency: true             # char-5gram + word-order penalty (penalty only): fluency_models_dir: /workspace/clean_rerun/assets/fluency_models, fluency_penalty_weight: 0.5, fluency_z_floor: -2.0
  # fluency_spelling_weight: 0.5   # Bible-trained diacritics term, only yor and kik

scorer:
  type: worker  # QE models run in a CHILD process with transformers 4.x (D-33)
  python: /workspace/venv_gemma/bin/python
  pythonpath: "/workspace/sft_build/pylibs_tf4:/workspace/sft_build/pylibs"
  model_id: masakhane/africomet-qe-stl-1.1
  ensemble_model_id: McGill-NLP/ssa-comet-mtl  # D-55: one worker with both checkpoints
  batch_size: 128  # the pair peaks at 6.7 GB at 128

eval_every: 35  # hold-out reward + greedy finished / loop rate at steps 35 and 70
eval_min_per_bin: 16  # D-45: >= 16 hold-out prompts of every bin, so the per-bin greedy loop rate exists in every stage
eval_prompts: 96  # F2: long greedy decodes (up to 7,168 tokens) make every evaluation prompt expensive
benchmark_eval_path: /workspace/clean_rerun/assets/dev/bench_afrisci_dev_sent.jsonl  # AfriScience-MT DEV sentences (843 per language x 6 languages: amh hau lug nso yor zul); an S set; the test split is never used during training
benchmark_eval_per_language: 200
benchmark_max_new_tokens: 512
benchmark_eval_every: 35  # sentence-level dev chrF++ at steps 35 and 70: the PRODUCTION mode must not regress
select_by: benchmark_chrf
select_min_gain: 0.2
select_min_finished_rate: 0.95
resume_reset_selection: true
benchmark_aux:  # monitor-only dev sets (never used for selection)
  - {name: afrisci_dev_doc, path: /workspace/clean_rerun/assets/dev/bench_afrisci_dev_doc.jsonl, per_language: 25, max_new_tokens: 7168, every: 35}
  - {name: general_dev, path: /workspace/clean_rerun/assets/dev/bench_dev_hsel.jsonl, per_language: 40, max_new_tokens: 256}
  - {name: weak_dev, path: /workspace/clean_rerun/assets/dev/bench_weak_hsel.jsonl, per_language: 60, max_new_tokens: 256, batch_size: 64}
save_every: 20
log_every: 1
check_sampler_logprobs: false
seed: 1234
extra_libs: [/workspace/sft_build/pylibs]  # sacrebleu for the dev chrF++
hub_repo_id: ${HF_ORG}/gemma-0.4B-science-rl  # ${HF_ORG}, PRIVATE (new names, not the old ${HF_ORG_LEGACY} ones); the launcher passes hub_repo_id=$HUB_PREFIX-<stage> (HUB_PREFIX defaults to ${HF_ORG}/gemma-mt-385m-rl; HUB_PREFIX= empty disables the push)
hub_branch: stage-f2-long
hub_latest_branch: latest  # the LATEST checkpoint = the end-of-stage model (the one handed to the next stage)
hub_latest_every: 25
hub_stage_branches: false
hub_private: true  # explicit: the pusher also re-asserts private on an existing repo, and the trainer refuses hub_private: false unless hub_allow_public: true
hub_allow_public: false
eval_vllm_only: true  # Amendment 4: every evaluation generation (hold-out reward, dev benchmark, aux sets) goes through vLLM; no HF generate fallback
keep_single_checkpoint: false  # False so that <out_dir>/final/ (the last-step HF model, the hand-off to the next stage) and best/ are written
archive: false  # F2 feeds nothing
archive_path: null
archive_min_reward_by_mode: {qe: 1.0, blend: 1.0, consensus: 0.5}
archive_min_consensus_chrf: 50.0
archive_flush_seconds: 20
archive_queue_size: 64
resume: true  # a crash-restart of the same stage resumes from <out_dir>/last (a NEW stage has a new out_dir: fresh optimizer)
wandb_project: null
run_name: null
