# AB2 SFT config 'S1 (GPU-time matched)' (generated by scripts/ab2_make_configs.py from AB1's weak-SFT config; changed keys: model_name, tokenizer_name, data_dir, out_dir, run_name, max_steps, schedule_start_step, learning_rate, warmup_ratio, warmup_steps, lr_hold_fraction, eval_every, save_every)
# SPDX-License-Identifier: AGPL-3.0-or-later
# AB1 (RL-vs-SFT-data ablation, paper section 8.4): the WEAK SFT start. Re-creates the first 3,500 steps of SFT stage A (configs/sft_long.yaml: AdamW lr 5e-5, language_alpha 0.5, floor 0.002,
# cap 4 epochs, seed 1234; the Hub keeps no early checkpoint, D-40) with the learning rate ANNEALED over the shortened horizon (cosine 5e-5 -> 5e-6, 3% warm-up).
# 3,500 steps x 32 packs x 4,096 tokens = 0.459 B training tokens = 12.7% of the 27,638 steps / 3.62 B tokens of SFT-final; the packs are exactly the ones the real stage A drew in its first
# 3,500 steps (balanced_schedule is sequential), delivered by scripts/ab1_build_weak_sft_data.py as a sparse copy of the packed set (the rest of tokens.u32.bin is a hole that is never read).
#   cd /workspace/jobs/ab2/gemma_mt && python -m gemma_mt.train_sft --config configs/ab1_sft_weak.yaml      (use scripts/launch_ab1.sh sft)
# Speed: the final 2,138 steps of the real run took 2.6 s/step (varlen attention + fused loss, micro 16 x accum 2, no checkpointing, RTX PRO 6000 alone) -> 2.5 h for 3,500 steps.
model_name: /workspace/jobs/ab2/models/sft_weak
tokenizer_name: /workspace/jobs/ab2/models/sft_weak
data_dir: /workspace/jobs/ab2/data/packed_s1
out_dir: /workspace/jobs/ab2/runs/sft_s1

attn_implementation: varlen          # as the final segment of the real run (D-35 / D-36)
mask_mode: auto
loss_impl: fused
param_dtype: float32
autocast_dtype: bfloat16
micro_batch_size: 16                 # 16 x 2 = 32 packs = 131,072 tokens per step, as in every SFT segment; the launcher steps down 8x4, 4x8 on an OOM
grad_accum_steps: 2
epochs: 1.0
max_steps: 420
learning_rate: 5e-06
min_lr_ratio: 0.1
warmup_steps: 20
warmup_ratio: 0.0
weight_decay: 0.01
beta1: 0.9
beta2: 0.95
eps: 1.0e-8
grad_clip: 1.0
optimizer: adamw

eval_every: 150
eval_max_packs: 0
early_stopping_patience: 0           # no early stopping: the run is a fixed token budget
min_epochs: 0.0
early_stop_action: propose
val_metric: macro
min_val_tokens_macro: 2000
save_every: 1000000
save_optimizer: true
log_every: 10
quick_eval_every: 0
gradient_checkpointing: false
loss_chunk_tokens: 2048
seed: 1234
wandb_project: null
run_name: ab2_sft_s1
resume: true

language_alpha: 0.5
min_language_share: 0.002
max_language_epochs: 4.0

hub_repo_id: null                    # nothing is pushed
keep_single_checkpoint: true         # only last/; the HF directory of the weak model is written by scripts/launch_ab1.sh (interpolate_weights.py --alpha 1.0, float32)
keep_prev_checkpoint: false
schedule_start_step: 3500
lr_hold_fraction: 0.8
